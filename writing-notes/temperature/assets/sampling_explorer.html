<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Sampling Explorer</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Load Babel to compile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- MathJax for rendering LaTeX (like the $k$ and $p$) -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body class="bg-transparent m-0 p-0">
    <!-- This is where the React app will be injected -->
    <div id="root"></div>

    <!-- The actual React Code -->
    <script type="text/babel">
        // Extract hooks from the global React object
        const { useState, useMemo } = React;

        const MOCK_VOCAB = [
            { id: 1, word: "the", logit: 8.5 },
            { id: 2, word: "cat", logit: 7.2 },
            { id: 3, word: "dog", logit: 6.8 },
            { id: 4, word: "sat", logit: 5.5 },
            { id: 5, word: "is", logit: 4.2 },
            { id: 6, word: "jumped", logit: 3.1 },
            { id: 7, word: "a", logit: 2.5 },
            { id: 8, word: "quickly", logit: 1.2 },
            { id: 9, word: "and", logit: 0.8 },
            { id: 10, word: "flugelhorn", logit: -0.5 },
        ];

        function SamplingExplorer() {
            const [temperature, setTemperature] = useState(1.0);
            const [topK, setTopK] = useState(10);
            const [topP, setTopP] = useState(1.0);

            // Compute the entire sampling pipeline
            const distribution = useMemo(() => {
                // 1. Temperature Scaling & Softmax
                let sumExp = 0;
                const withTemp = MOCK_VOCAB.map(item => {
                    const t = Math.max(temperature, 0.01);
                    const scaledLogit = item.logit / t;
                    const exp = Math.exp(scaledLogit);
                    sumExp += exp;
                    return { ...item, scaledLogit, exp };
                });

                const withSoftmax = withTemp.map(item => ({
                    ...item,
                    prob: item.exp / sumExp
                }));

                // 2. Sort by probability descending for Truncation
                const sorted = [...withSoftmax].sort((a, b) => b.prob - a.prob);

                // 3. Apply Top-K and Top-P filters
                let cumulativeProb = 0;
                let survivedSum = 0;

                const filtered = sorted.map((item, index) => {
                    let isKept = true;

                    // Top-K Filter
                    if (index >= topK) {
                        isKept = false;
                    }

                    // Top-P Filter (Nucleus)
                    if (isKept) {
                        if (cumulativeProb >= topP) {
                            isKept = false;
                        } else {
                            cumulativeProb += item.prob;
                        }
                    }

                    if (isKept) {
                        survivedSum += item.prob;
                    }

                    return { ...item, isKept, cumulativeProb };
                });

                // 4. Renormalize surviving probabilities
                const finalData = filtered.map(item => ({
                    ...item,
                    finalProb: item.isKept ? (item.prob / survivedSum) : 0
                }));

                return finalData;
            }, [temperature, topK, topP]);

            return (
                <div className="flex flex-col p-6 bg-slate-50 text-slate-900 rounded-xl max-w-4xl mx-auto shadow-sm border border-slate-200 font-sans">
                    <h2 className="text-2xl font-bold mb-2">LLM Sampling Explorer</h2>
                    <p className="text-slate-600 mb-6 text-sm">
                        See how Temperature, Top-k, and Top-p sequentially filter and reshape the probability distribution of tokens.
                    </p>

                    {/* Controls */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 bg-white p-4 rounded-lg shadow-sm border border-slate-100">
                        <div className="flex flex-col">
                            <label className="font-semibold text-sm mb-2 flex justify-between items-center">
                                <span>Temperature (T)</span>
                                <span className="text-blue-600 bg-blue-50 px-2 py-1 rounded text-xs font-bold">{temperature.toFixed(2)}</span>
                            </label>
                            <input 
                                type="range" min="0.1" max="3.0" step="0.1" 
                                value={temperature} 
                                onChange={(e) => setTemperature(parseFloat(e.target.value))}
                                className="accent-blue-500"
                            />
                            <span className="text-xs text-slate-500 mt-1">Flattens or sharpens distribution</span>
                        </div>

                        <div className="flex flex-col">
                            <label className="font-semibold text-sm mb-2 flex justify-between items-center">
                                <span>Top-k</span>
                                <span className="text-purple-600 bg-purple-50 px-2 py-1 rounded text-xs font-bold">{topK}</span>
                            </label>
                            <input 
                                type="range" min="1" max="10" step="1" 
                                value={topK} 
                                onChange={(e) => setTopK(parseInt(e.target.value))}
                                className="accent-purple-500"
                            />
                            <span className="text-xs text-slate-500 mt-1">Maximum number of tokens to keep</span>
                        </div>

                        <div className="flex flex-col">
                            <label className="font-semibold text-sm mb-2 flex justify-between items-center">
                                <span>Top-p (Nucleus)</span>
                                <span className="text-emerald-600 bg-emerald-50 px-2 py-1 rounded text-xs font-bold">{topP.toFixed(2)}</span>
                            </label>
                            <input 
                                type="range" min="0.1" max="1.0" step="0.05" 
                                value={topP} 
                                onChange={(e) => setTopP(parseFloat(e.target.value))}
                                className="accent-emerald-500"
                            />
                            <span className="text-xs text-slate-500 mt-1">Cumulative probability threshold</span>
                        </div>
                    </div>

                    {/* Visualization */}
                    <div className="bg-white p-4 rounded-lg shadow-sm border border-slate-100 mb-6">
                        <div className="flex flex-col sm:flex-row justify-between sm:items-end mb-4 border-b pb-2 gap-2">
                            <h3 className="font-bold text-slate-700">Token Probability Distribution</h3>
                            <div className="flex space-x-4 text-xs font-medium">
                                <div className="flex items-center"><div className="w-3 h-3 bg-slate-200 rounded mr-1"></div> Original Softmax</div>
                                <div className="flex items-center"><div className="w-3 h-3 bg-blue-500 rounded mr-1"></div> Final (Renormalized)</div>
                                <div className="flex items-center"><div className="w-3 h-3 border-2 border-red-300 border-dashed rounded mr-1"></div> Truncated</div>
                            </div>
                        </div>

                        <div className="space-y-3">
                            {distribution.map((item) => (
                                <div key={item.id} className="flex items-center">
                                    <div className="w-24 text-right pr-4 font-mono text-sm truncate">
                                        "{item.word}"
                                    </div>
                                    <div className="flex-grow h-8 relative bg-slate-50 rounded overflow-hidden">
                                        <div 
                                            className={`absolute top-0 left-0 h-full transition-all duration-300 ease-in-out ${item.isKept ? 'bg-slate-200' : 'bg-red-50 border-2 border-red-200 border-dashed opacity-50'}`}
                                            style={{ width: `${item.prob * 100}%` }}
                                        ></div>
                                        <div 
                                            className="absolute top-0 left-0 h-full bg-blue-500 transition-all duration-300 ease-in-out"
                                            style={{ width: `${item.finalProb * 100}%`, opacity: item.isKept ? 1 : 0 }}
                                        ></div>
                                        <div className="absolute top-0 left-0 h-full flex items-center pl-2 text-xs font-semibold drop-shadow-md">
                                            {item.isKept ? (
                                                <span className={`${item.finalProb > 0.1 ? 'text-white' : 'text-slate-600'}`}>
                                                    {(item.finalProb * 100).toFixed(1)}%
                                                </span>
                                            ) : (
                                                <span className="text-red-400">Dropped</span>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    
                    {/* Pipeline Explanation */}
                    <div className="text-sm text-slate-600 bg-blue-50/50 p-4 rounded border border-blue-100">
                        <strong>Pipeline Steps Evaluated:</strong> 
                        <ol className="list-decimal ml-5 mt-2 space-y-1">
                            <li><strong>Softmax(T):</strong> Logits divided by {temperature.toFixed(2)}, then exponential normalization.</li>
                            <li><strong>Top-k:</strong> Retain only the top {topK} highest probability tokens.</li>
                            <li><strong>Top-p:</strong> Starting from highest probability, accumulate. Truncate tokens once sum exceeds {topP.toFixed(2)}.</li>
                            <li><strong>Renormalize:</strong> Scale the surviving probabilities so they sum back to 100%.</li>
                        </ol>
                    </div>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SamplingExplorer />);
    </script>
</body>
</html>
